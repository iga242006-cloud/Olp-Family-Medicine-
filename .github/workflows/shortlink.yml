name: Create short link

on:
  push:
    branches: [claude/olp-demo-setup-aicfjt]
    paths: ['.github/workflows/shortlink.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortlink:
    runs-on: ubuntu-latest
    steps:
      - name: Create memorable short link for the demo site
        run: |
          TARGET="https://raw.githack.com/iga242006-cloud/Olp-Family-Medicine-/gh-pages/index.html"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$TARGET")
          for alias in OlpFamilyMedicine olpfamilymedicine olpfamilymed olpdemo; do
            resp=$(curl -s --max-time 20 "https://da.gd/shorten?url=$ENC&shorturl=$alias" || echo "request failed")
            echo "DAGD TRY $alias => $resp"
            case "$resp" in
              https://da.gd/*) echo "SHORTLINK OK: $resp"; exit 0;;
            esac
          done
          for svc in "https://v.gd/create.php?format=simple&shorturl=OlpFamilyMedicine&url=$ENC" \
                     "https://tinyurl.com/api-create.php?url=$ENC"; do
            resp=$(curl -s --max-time 20 "$svc" || echo "request failed")
            echo "ALT TRY => $resp"
            case "$resp" in
              https://*) echo "SHORTLINK OK: $resp"; exit 0;;
            esac
          done
          echo "SHORTLINK FAILED on all services"

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/olp-demo-setup-aicfjt]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./olp-demo

  deploy-actions:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: olp-demo
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-urls:
    runs-on: ubuntu-latest
    needs: publish-branch
    steps:
      - name: Check which URLs serve the site
        run: |
          sleep 30
          for u in \
            "https://iga242006-cloud.github.io/Olp-Family-Medicine-/" \
            "https://raw.githack.com/iga242006-cloud/Olp-Family-Medicine-/gh-pages/index.html" \
            "https://rawcdn.githack.com/iga242006-cloud/Olp-Family-Medicine-/gh-pages/index.html" \
            "https://cdn.statically.io/gh/iga242006-cloud/Olp-Family-Medicine-/gh-pages/index.html"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$u" || echo ERR)
            ctype=$(curl -s -o /dev/null -w "%{content_type}" -L --max-time 20 "$u" || echo ERR)
            echo "URLCHECK $code $ctype $u"
          done
